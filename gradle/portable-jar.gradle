import java.nio.ByteBuffer
import java.nio.ByteOrder
import java.util.zip.ZipFile

def graphicsJars = configurations.runtimeClasspath.filter { it.name.startsWith('javafx-graphics-') }

// Development classpaths need one macOS architecture; the release merges both below.
if (System.getProperty('os.name').startsWith('Mac')) {
    String macPlatform = System.getProperty('os.arch') in ['aarch64', 'arm64'] ? 'mac-aarch64' : 'mac'
    def usesHostMacNatives = { File archive ->
        !archive.name.matches('javafx-graphics-.*-mac(-aarch64)?\\.jar')
                || archive.name.endsWith("-${macPlatform}.jar")
    }
    tasks.withType(Test).configureEach {
        classpath = sourceSets.test.runtimeClasspath.filter(usesHostMacNatives)
    }
    tasks.named('run') {
        classpath = sourceSets.main.runtimeClasspath.filter(usesHostMacNatives)
    }
}

def macNatives = layout.buildDirectory.dir('generated/universal-macos')

// macOS loads either CPU slice from one universal binary, avoiding duplicate resource names.
// Format: https://github.com/apple-oss-distributions/cctools/blob/main/include/mach-o/fat.h
tasks.register('prepareMacNatives') {
    inputs.files(graphicsJars)
    outputs.dir(macNatives)
    doLast {
        def slices = ['mac', 'mac-aarch64'].collect { platform ->
            File archive = graphicsJars.files.find { it.name.endsWith("-${platform}.jar") }
            new ZipFile(archive).withCloseable { zip ->
                zip.entries().findAll { it.name.endsWith('.dylib') }.collectEntries { entry ->
                    [(entry.name): zip.getInputStream(entry).withCloseable { it.bytes }]
                }
            }
        }
        if (slices[0].isEmpty() || slices[0].keySet() != slices[1].keySet()) {
            throw new GradleException('Intel and ARM macOS native library names must match.')
        }
        File destination = macNatives.get().asFile
        destination.mkdirs()
        slices[0].each { name, intel ->
            def libraries = [intel, slices[1][name]]
            def headers = libraries.collect { ByteBuffer.wrap(it).order(ByteOrder.LITTLE_ENDIAN) }
            def cpuTypes = [0x01000007, 0x0100000c] // x86_64, arm64
            headers.eachWithIndex { header, index ->
                if (header.getInt(0) != (int) 0xfeedfacf || header.getInt(4) != cpuTypes[index]) {
                    throw new GradleException("Unexpected Mach-O architecture in ${name}.")
                }
            }
            // 16 KiB alignment supports both Intel and Apple Silicon page sizes.
            int alignment = 16384
            int armOffset = ((alignment + intel.length + alignment - 1).intdiv(alignment)) * alignment
            ByteBuffer universal = ByteBuffer.allocate(armOffset + libraries[1].length)
            universal.putInt((int) 0xcafebabe).putInt(2)
            [alignment, armOffset].eachWithIndex { offset, index ->
                universal.putInt(headers[index].getInt(4)).putInt(headers[index].getInt(8))
                        .putInt(offset).putInt(libraries[index].length).putInt(14)
            }
            universal.position(alignment)
            universal.put(libraries[0])
            universal.position(armOffset)
            universal.put(libraries[1])
            [alignment, armOffset].eachWithIndex { offset, index ->
                assert Arrays.equals(libraries[index], Arrays.copyOfRange(universal.array(),
                        offset, offset + libraries[index].length))
                        : "Universal library must preserve ${name}'s original CPU slices."
            }
            new File(destination, name).bytes = universal.array()
        }
    }
}

shadowJar {
    dependsOn tasks.named('prepareMacNatives')
    // Replace the colliding macOS resources while retaining every platform's graphics classes and natives.
    configurations = [project.configurations.runtimeClasspath.copyRecursive()
            .exclude(group: 'org.openjfx', module: 'javafx-graphics')]
    from({ graphicsJars.collect { zipTree(it) } }) {
        exclude '*.dylib'
    }
    from(macNatives)
}
