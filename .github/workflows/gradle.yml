name: Java CI

on: [push, pull_request]

jobs:
  build:
    strategy:
      matrix:
        platform: [ubuntu-latest, macos-15, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Set up repository
        uses: actions/checkout@v7

      - name: Run repository-wide tests
        if: runner.os == 'Linux'
        working-directory:  ${{ github.workspace }}/.github
        run: ./run-checks.sh

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'
          java-package: ${{ runner.os == 'macOS' && 'jdk' || 'jdk+fx' }}

      - name: Build and check with Gradle on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a ./gradlew check coverage shadowJar

      - name: Build and check with Gradle
        if: runner.os != 'Linux'
        run: ./gradlew check coverage

      - name: Upload coverage reports to Codecov
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Record release checksum
        if: runner.os == 'Linux'
        working-directory: build/libs
        run: sha256sum cyclique.jar > cyclique.jar.sha256

      - name: Upload the release JAR
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: mac-release-test
          path: |
            build/libs/cyclique.jar
            build/libs/cyclique.jar.sha256

  mac-release:
    needs: build
    strategy:
      matrix:
        include:
          - platform: macos-15
            renderer: default
            java-options: ''
          # Zulu JDK+FX 25.0.3's Metal renderer aborts on the Intel hosted VM.
          - platform: macos-15-intel
            renderer: OpenGL
            java-options: '-Dprism.order=es2,sw'
    name: Packaged JAR (${{ matrix.platform }}, ${{ matrix.renderer }})
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 10
    steps:
      - name: Set up repository
        uses: actions/checkout@v7

      - name: Setup prescribed Mac JDK with JavaFX
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25.0.3'
          java-package: jdk+fx

      - name: Download the same release JAR on both Macs
        uses: actions/download-artifact@v4
        with:
          name: mac-release-test
          path: build/libs

      - name: Verify checksum
        working-directory: build/libs
        run: shasum -a 256 -c cyclique.jar.sha256

      - name: Launch and exit the packaged application
        shell: bash
        run: |
          java -version
          smoke_dir=$(mktemp -d)
          cd "$smoke_dir"
          java ${{ matrix.java-options }} -Djavafx.cachedir="$smoke_dir/natives" \
            -cp "$GITHUB_WORKSPACE/build/libs/cyclique.jar" \
            "$GITHUB_WORKSPACE/src/test/java/seedu/address/testutil/PackagedJarSmokeTest.java"
