plugins {
    id 'java'
    id 'checkstyle'
    id 'com.gradleup.shadow' version '9.5.1'
    id 'application'
    id 'jacoco'
}

application {
    mainClass = 'seedu.address.Main'
}

run {
    enableAssertions = true
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    mavenCentral()
    maven { url = 'https://oss.sonatype.org/content/repositories/snapshots/' }
}

checkstyle {
    toolVersion = '14.1.0'
}

test {
    enableAssertions = true
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

task coverage(type: JacocoReport) {
    dependsOn test
    sourceDirectories.from files(sourceSets.main.allSource.srcDirs)
    classDirectories.from files(sourceSets.main.output)
    executionData.from files(jacocoTestReport.executionData)
    afterEvaluate {
        classDirectories.from files(classDirectories.files.collect {
            fileTree(dir: it, exclude: ['**/*.jar'])
        })
    }
    reports {
        html.required = true
        xml.required = true
    }
}

dependencies {
    String jUnitVersion = '5.14.4'
    String javaFxVersion = '17.0.7'
    String osName = System.getProperty('os.name').toLowerCase(Locale.ROOT)
    String osArch = System.getProperty('os.arch').toLowerCase(Locale.ROOT)
    boolean isArm64 = osArch in ['aarch64', 'arm64']
    boolean isX64 = osArch in ['amd64', 'x86_64']
    String javaFxPlatform

    // JavaFX native libraries must match the JVM running Gradle.
    if (osName.contains('mac') && (isArm64 || isX64)) {
        javaFxPlatform = isArm64 ? 'mac-aarch64' : 'mac'
    } else if (osName.contains('linux') && (isArm64 || isX64)) {
        javaFxPlatform = isArm64 ? 'linux-aarch64' : 'linux'
    } else if (osName.startsWith('windows') && isX64) {
        javaFxPlatform = 'win'
    } else {
        throw new GradleException("Unsupported JavaFX ${javaFxVersion} platform: ${osName} (${osArch})")
    }

    ['base', 'controls', 'fxml', 'graphics'].each { module ->
        implementation "org.openjfx:javafx-${module}:${javaFxVersion}:${javaFxPlatform}"
    }

    implementation 'com.fasterxml.jackson.core:jackson-databind:2.7.0'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.7.4'

    testImplementation "org.junit.jupiter:junit-jupiter-api:${jUnitVersion}"

    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${jUnitVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.4'
}

shadowJar {
    archiveFileName = 'cyclique.jar'
}

defaultTasks 'clean', 'test'
