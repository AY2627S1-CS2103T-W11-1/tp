plugins {
    id 'java'
    id 'checkstyle'
    id 'com.gradleup.shadow' version '9.5.1'
    id 'application'
    id 'jacoco'
}

application {
    mainClass = 'seedu.address.Main'
}

run {
    enableAssertions = true
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    mavenCentral()
    maven { url = 'https://oss.sonatype.org/content/repositories/snapshots/' }
}

checkstyle {
    toolVersion = '14.1.0'
}

test {
    enableAssertions = true
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

task coverage(type: JacocoReport) {
    dependsOn test
    sourceDirectories.from files(sourceSets.main.allSource.srcDirs)
    classDirectories.from files(sourceSets.main.output)
    executionData.from files(jacocoTestReport.executionData)
    afterEvaluate {
        classDirectories.from files(classDirectories.files.collect {
            fileTree(dir: it, exclude: ['**/*.jar'])
        })
    }
    reports {
        html.required = true
        xml.required = true
    }
}

configurations {
    javafxRelease {
        transitive = false
    }
}

dependencies {
    String jUnitVersion = '5.14.4'
    String javaFxVersion = '17.0.7'
    String osName = System.getProperty('os.name').toLowerCase(Locale.ROOT)
    String osArch = System.getProperty('os.arch').toLowerCase(Locale.ROOT)
    boolean isArm64 = osArch in ['aarch64', 'arm64']
    boolean isX64 = osArch in ['amd64', 'x86_64']
    String javaFxPlatform

    // JavaFX native libraries must match the JVM running Gradle.
    if (osName.contains('mac') && (isArm64 || isX64)) {
        javaFxPlatform = isArm64 ? 'mac-aarch64' : 'mac'
    } else if (osName.contains('linux') && (isArm64 || isX64)) {
        javaFxPlatform = isArm64 ? 'linux-aarch64' : 'linux'
    } else if (osName.startsWith('windows') && isX64) {
        javaFxPlatform = 'win'
    } else {
        throw new GradleException("Unsupported JavaFX ${javaFxVersion} platform: ${osName} (${osArch})")
    }

    ['base', 'controls', 'fxml', 'graphics'].each { module ->
        implementation "org.openjfx:javafx-${module}:${javaFxVersion}:${javaFxPlatform}"
        ['win', 'mac', 'mac-aarch64', 'linux', 'linux-aarch64'].each { platform ->
            javafxRelease "org.openjfx:javafx-${module}:${javaFxVersion}:${platform}"
        }
    }

    implementation 'com.fasterxml.jackson.core:jackson-databind:2.7.0'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.7.4'

    testImplementation "org.junit.jupiter:junit-jupiter-api:${jUnitVersion}"

    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${jUnitVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.4'
}

shadowJar {
    archiveFileName = 'cyclique.jar'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    // Merge platform-specific Java classes, but keep same-named native libraries apart.
    dependencies {
        exclude(dependency('org.openjfx:.*:.*'))
    }
    project.configurations.javafxRelease.resolvedConfiguration.resolvedArtifacts.each { artifact ->
        from(zipTree(artifact.file)) {
            exclude '**/*.dll', '**/*.dylib', '**/*.so', 'META-INF/**', 'module-info.class'
        }
        from(zipTree(artifact.file)) {
            include '**/*.dll', '**/*.dylib', '**/*.so'
            into "javafx-natives/${artifact.classifier}"
        }
    }
}

tasks.register('verifyJavafxPackaging') {
    dependsOn shadowJar
    doLast {
        new java.util.jar.JarFile(shadowJar.archiveFile.get().asFile).withCloseable { releaseJar ->
            project.configurations.javafxRelease.resolvedConfiguration.resolvedArtifacts.each { artifact ->
                new java.util.zip.ZipFile(artifact.file).withCloseable { sourceJar ->
                    sourceJar.entries().each { entry ->
                        if (entry.name.endsWith('.dll') || entry.name.endsWith('.dylib')
                                || entry.name.endsWith('.so')) {
                            String path = "javafx-natives/${artifact.classifier}/${entry.name}"
                            def bundled = releaseJar.getJarEntry(path)
                            if (bundled == null) {
                                throw new GradleException("Missing JavaFX native library: ${path}")
                            }
                            byte[] expected = sourceJar.getInputStream(entry).withCloseable { it.bytes }
                            byte[] actual = releaseJar.getInputStream(bundled).withCloseable { it.bytes }
                            if (!Arrays.equals(expected, actual)) {
                                throw new GradleException("Incorrect JavaFX native library: ${path}")
                            }
                            if (releaseJar.getJarEntry(entry.name) != null) {
                                throw new GradleException("Unscoped JavaFX native library: ${entry.name}")
                            }
                        }
                    }
                }
            }
            ['win/WinApplication', 'mac/MacApplication', 'gtk/GtkApplication'].each { platformClass ->
                if (releaseJar.getJarEntry("com/sun/glass/ui/${platformClass}.class") == null) {
                    throw new GradleException("Missing JavaFX platform class: ${platformClass}")
                }
            }
        }
    }
}

check.dependsOn verifyJavafxPackaging

defaultTasks 'clean', 'test'
